name: Build and test PR

on:
  pull_request:

permissions:
  contents: read
  packages: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm_lint:
    name: Helm lint
    strategy:
      matrix:
        environments: ['dev', 'test', 'preprod', 'prod']
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/test_helm_lint.yml@v2
    secrets: inherit
    with:
      environment: ${{ matrix.environments }}

  node_build:
    name: Build
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/node_build.yml@v2
    secrets: inherit
    with:
      install_command: 'npm run setup'

  node_unit_tests:
    name: Unit tests
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/node_unit_tests.yml@v2
    needs: [node_build]
    secrets: inherit

  playwright_component_tests:
    name: Component tests
    runs-on: ubuntu-latest
    needs: [node_build]
    steps:
      - uses: actions/checkout@v6

      - name: Run setup
        run: npm run setup

      - name: Install Playwright
        run: npx playwright install

      - name: Run Component Tests
        run: npm run component-test

      - name: Upload test results
        if: '!cancelled()'
        uses: actions/upload-artifact@v7
        with:
          name: test_playwright-component-results
          path: |
            test_results/

      - name: Archive screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: component-test-screenshots
          path: |
            test_results/playwright/test-output/**/*

  build_docker:
    name: Build docker image
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/docker_build.yml@v2
    with:
      docker_registry: 'ghcr.io'
      registry_org: 'ministryofjustice'
      tag_latest: false
      push: false
      load: true
      docker_multiplatform: false
      upload_image_artifact: true
      image_artifact_retention_days: 1

  e2e_test:
    name: E2E tests
    needs: [build_docker]
    uses: ./.github/workflows/e2e_test.yml
    with:
      app_version: ${{ needs.build_docker.outputs.app_version }}
      docker_multiplatform: false
      total_shards: 4
