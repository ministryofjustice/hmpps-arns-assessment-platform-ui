name: Pact consumer test and publish

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: App version used for the Docker image tag / Helm deploy.
        required: true
        type: string
  workflow_call:
    inputs:
      app_version:
        description: App version used for the Docker image tag / Helm deploy.
        required: true
        type: string

jobs:
  pact_test_publish:
    name: Pact consumer test and publish
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Apply webhook for hmpps-assess-risks-and-needs
        permissions:
          contents: read
          id-token: write
        uses: ministryofjustice/hmpps-github-actions/.github/workflows/pact_apply_webhook.yml@386d4ea009b450ddd4e6d37c2a1f484762bfa9de
        with:
          provider_repository: hmpps-assess-risks-and-needs
          webhook_name: hmpps-assess-risks-and-needs
          webhook_id: dHJlZWZld2Vyd2luZGJv
        secrets:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
          HMPPS_PACT_BROKER_USERNAME: ${{ secrets.HMPPS_PACT_BROKER_USERNAME }}
          HMPPS_PACT_BROKER_PASSWORD: ${{ secrets.HMPPS_PACT_BROKER_PASSWORD }}
      - name: Generate Pact contracts
        run: npm run pact:test
      - name: Publish pacts
        run: npm run pact:publish -- --consumer-app-version="${{ inputs.app_version }}" --broker-base-url="${{ PACT_BROKER_URL }}" --broker-username="${{ HMPPS_PACT_BROKER_USERNAME }}" --broker-password="${{ HMPPS_PACT_BROKER_PASSWORD }}"
