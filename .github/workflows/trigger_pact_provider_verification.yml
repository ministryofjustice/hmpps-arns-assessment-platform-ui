name: Run

on:
  workflow_call:
    inputs:
      app_version:
        description: |
          App version used for the Docker image tag / Helm deploy.
          Not used for Pact Broker lookups - those always use github.sha,
          matching the version published during provider verification.
        required: true
        type: string

permissions:
  contents: read

jobs:
  trigger_pact_provider_verification:
    name: Trigger Pact Provider Verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider:
          - name: AAP API
            repo: hmpps-arns-assessment-platform-api
          - name: ARNS API
            repo: hmpps-assess-risks-and-needs
    steps:
      - name: Generate Token for ${{ matrix.provider.name }}
        uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          app-id: ${{ secrets.INTEGRATION_TESTS_TRIGGER_APP_ID }}
          private-key: ${{ secrets.INTEGRATION_TESTS_TRIGGER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-actions: write
          repositories: ${{ matrix.provider.repo }}

      - name: Trigger ${{ matrix.provider.name }} Pact provider verification workflow
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CONSUMER_NAME: ${{ github.event.repository.name }}
          CONSUMER_BRANCH: ${{ github.ref_name }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'ministryofjustice',
              repo: '${{ matrix.provider.repo }}',
              workflow_id: 'pact_provider_verification.yml',
              ref: 'main',
              inputs: {
                consumerName: process.env.CONSUMER_NAME,
                consumerBranch: process.env.CONSUMER_BRANCH,
                publishResults: 'true',
              }
            })
