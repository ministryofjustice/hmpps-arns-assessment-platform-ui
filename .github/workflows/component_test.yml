name: Component tests

on:
  workflow_call:

permissions:
  contents: read
  checks: write

jobs:
  component_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run setup
        run: npm run setup

      - name: Install Playwright
        run: npx playwright install

      - name: Run Component Tests
        run: npm run component-test

      - name: Upload test results
        if: '!cancelled()'
        uses: actions/upload-artifact@v7
        with:
          name: test_playwright-component-results
          path: |
            test_results/

      - name: Archive screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: component-test-screenshots
          path: |
            test_results/playwright/test-output/**/*
