name: Trigger Perf Test

on:
  push:
    branches:
      - 'ci/perf-smoke-test'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: string
        required: true
        default: 'dev'
      ui_name:
        description: UI name
        type: string
        required: true
        default: 'san'
  workflow_call:
    inputs:
      environment:
        description: Environment
        type: string
        required: true
        default: 'dev'
      ui_name:
        description: UI name
        type: string
        required: true
        default: 'san'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  dev: 'https://arns-assessment-platform-dev.hmpps.service.justice.gov.uk'
  test: 'https://arns-assessment-platform-test.hmpps.service.justice.gov.uk'

jobs:
  run_perf_tests:
    name: Run perf tests
    if: contains(fromJSON('["dev", "test"]'), inputs.environment)
    runs-on: [self-hosted, hmpps-github-actions-runner]
    steps:
      - name: Obtain Octo STS Token
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05
        id: octo_sts
        with:
          scope: ministryofjustice/hmpps-arns-integrations-test-playwright
          identity: moj-hmpps-arns-assessment-platform-ui
      - name: Checkout aap perf tests
        id: checkout_e2e_repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          token: ${{ steps.octo_sts.outputs.token }}
          repository: ministryofjustice/hmpps-arns-integrations-test-playwright
          path: perf-tests
      - uses: ./perf-tests/.github/actions/k6_setup
      - name: run k6 ${{ inputs.ui_name }} test
        uses: grafana/run-k6-action@4082a08c7e40cf6d65863911077dfb60ae0a4f04
        with:
          path: ./perf-tests/performance/tests/${{ inputs.ui_name }}-ui-smoke.js
          env:
            BASE_URL: ${{ env[inputs.environment] }}

      - uses: ./perf-tests/.github/actions/k6_artefacts
        if: always()
